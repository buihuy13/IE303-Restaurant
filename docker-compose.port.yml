        ports:
            - "${ORDER_PORT}:${ORDER_PORT}"
    dashboard-service:
        ports:
            - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    blog-service:
        ports:
            - "${BLOG_PORT}:${BLOG_PORT}"
    payment-service:
        ports:
            - "${PAYMENT_PORT}:${PAYMENT_PORT}"
