services:
    zipkin:
        image: openzipkin/zipkin
    rabbitmq:
        image: 'rabbitmq:3-management'
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
        healthcheck:
            test: ['CMD', 'rabbitmqctl', 'status']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    redis:
        image: 'redis:7-alpine'
        container_name: redis
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s # Check mỗi 10s
            timeout: 3s # Không response sau 3s thì timeout
            retries: 5 # Thử lại 5 lần trước khi mark là unhealthy
            start_period: 10s # Cho 10s bắt đầu trước khi healthcheck
    
    keycloak:
        image: quay.io/keycloak/keycloak:24.0.0
        #override entrypoint để chạy script init.sh
        entrypoint: ["/bin/bash"]
        command: ["/tmp/init.sh"]
        env_file:
            - ./.env
        environment:
            - KC_DB=postgres
            - KC_HEALTH_ENABLED=true
            - KC_METRICS_ENABLED=true
            - KC_HTTP_PORT=9091
            - KC_HOSTNAME=localhost
            - KC_HOSTNAME_PATH=/auth
            - KC_PROXY=edge
            - KC_HTTP_RELATIVE_PATH=/auth
        ports:  
            - '9090:9091'
        volumes:
            - ./keycloak-config/realm.json:/tmp/realm.json:ro
            - ./keycloak-config/init.sh:/tmp/init.sh:ro
            - ./keycloak-config/themes:/opt/keycloak/themes
    prometheus:
        image: prom/prometheus:latest
        container_name: 'prometheus'
        restart: 'unless-stopped'
        ports:
            - '9000:9090'
        volumes:
            - ./monitoring:/etc/prometheus
            - prometheus-data:/prometheus
        command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml
        healthcheck:
            test: [ "CMD", "nc", "-z", "localhost", "9090" ]
    grafana:
        image: grafana/grafana:latest
        env_file:
            - ./.env
        container_name: grafana
        restart: 'unless-stopped'
        ports:
            - '3030:3000'
        volumes:
            - grafana-data:/var/lib/grafana #Lưu dashboard lại khi restart container
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - prometheus
        healthcheck:
            test: [ "CMD", "nc", "-z", "localhost", "3000" ]
    caddy:
        image: caddy:2-alpine
        container_name: caddy
        restart: unless-stopped
        ports:
            - "8443:8443"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - api-gateway
            #- frontend
            - keycloak
    postgres:
        image: postgis/postgis:16-3.4   # PostgreSQL + PostGIS
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: restaurant-service
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/main.prod.sql:/docker-entrypoint-initdb.d/01-init_postgres.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant-service"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
    service-discovery:
        build:
            context: ./backend
            dockerfile: ./service-discovery/Dockerfile
            args:
                MODULE_PATH: service-discovery
        env_file:
            - ./.env
        environment:
            - PORT=${SERVICE_DISCOVERY_PORT}
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:8761/actuator/health | grep UP || exit 1']
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 60s
    api-gateway:
        build:
            context: ./backend
            dockerfile: ./api-gateway/Dockerfile
            args:
                MODULE_PATH: api-gateway
        expose:
            - '8080'
        env_file:
            - ./.env
        environment:
            - PORT=${API_GATEWAY_PORT}
        depends_on:
            service-discovery:
                condition: service_started
    user-service:
        build:
            context: ./backend
            dockerfile: ./user-service/Dockerfile
            args:
                MODULE_PATH: user-service
        env_file:
            - ./.env
        environment:
            - PORT=${USER_PORT}
        depends_on:
            postgres:
                condition: service_healthy
            service-discovery:
                condition: service_started
    notification-service:
        build:
            context: ./backend
            dockerfile: ./notification-service/Dockerfile
            args:
                MODULE_PATH: notification-service
        env_file:
            - ./.env
        environment:
            - PORT=${NOTIFICATION_PORT}
            - PASSWORD=${SMTP_PASSWORD}
        depends_on:
            service-discovery:
                condition: service_started
    chat-service:
        build:
            context: ./backend
            dockerfile: ./chat-service/Dockerfile
            args:
                - MODULE_PATH=chat-service
        env_file:
            - ./.env
        environment:
            - PORT=${CHAT_PORT}
        depends_on:
            postgres:
                condition: service_healthy
            service-discovery:
                condition: service_started
            redis:
                condition: service_healthy
    recommendation-service:
        build:
            context: ./backend
            dockerfile: ./recommendation-service/Dockerfile
            args:
                - MODULE_PATH=recommendation-service
        env_file:
            - ./.env
        environment:
            - PORT=${RECOMMENDATION_PORT}
        depends_on:
            service-discovery:
                condition: service_started

volumes:
    grafana-data:
    prometheus-data:
    caddy_data:
    caddy_config:
    postgres_data: