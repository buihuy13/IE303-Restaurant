spring.config.import=optional:file:.env[.properties]

jwt.secretkey=${JWT_SECRETKEY:dev-secret}

# Chỉ dùng zipkin khi deploy lên docker

management.tracing.enabled=true
# Mở tất cả các endpoint của Actuator (health, metrics, zipkin...) qua web
management.tracing.sampling.probability=1.0
# endpoint của zipkin server
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# Actuator with prometheus
management.prometheus.metrics.export.enabled=true
#Gateway endpoint actuator
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=gateway,health,info,prometheus,circuitbreakers

#redis config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:abcxyz}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:9090/auth/realms/restaurant-realm}
