# resilience4j config (circuit breaker)
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10  # Theo dõi 10 request gần nhất
        permittedNumberOfCallsInHalfOpenState: 3 # Cho phép 3 request thử khi đang Half-Open
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5  # Tối thiểu 5 request mới bắt đầu tính toán
        waitDurationInOpenState: 4s  # Chờ 4s trước khi thử mở lại mạch (Half-Open)
        failureRateThreshold: 50  # Nếu 50% request bị lỗi -> Ngắt mạch
        eventConsumerBufferSize: 10
        slowCallRateThreshold: 60  # % slow calls -> open
        slowCallDurationThreshold: 2s  # Call > 3s = slow
        automaticTransitionFromOpenToHalfOpenEnabled: true # Tự động chuyển từ OPEN sang HALF_OPEN
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          # 5xx từ downstream service
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout

        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$UnprocessableEntity
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s # service response > 3s thì xem là timeout
        cancelRunningFuture: true

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized