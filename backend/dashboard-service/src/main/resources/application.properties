spring.application.name=dashboard-service

#Swagger
springdoc.api-docs.path=/v3/api-docs/dashboard-service
springdoc.swagger-ui.enabled=false

spring.config.import=optional:file:.env[.properties]

server.port=${PORT}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
#eureka.instance.hostname=localhost
#eureka.instance.prefer-ip-address=false
#eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}

gateway.url=${GATEWAY_URL}

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Custom Cache TTLs
cache.overview-ttl=5m
cache.stats-ttl=10m
cache.revenue-ttl=2m
