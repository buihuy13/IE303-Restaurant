spring.application.name=payment-service

#Swagger
springdoc.api-docs.path=/v3/api-docs/payment-service
springdoc.swagger-ui.enabled=false
springdoc.info.title=Payment Service API
springdoc.info.description=API documentation for Payment Service
springdoc.info.version=1.0.0

spring.config.import=optional:file:.env[.properties]

server.port=${PORT}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

# Tracing & Monitoring
management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
management.metrics.export.prometheus.enabled=true

# Database PostgreSQL
spring.datasource.url=${PAYMENT_SERVICE_DB_URL}
spring.datasource.username=${PAYMENT_SERVICE_DB_USER}
spring.datasource.password=${PAYMENT_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kết nối Global 
gateway.url=${GATEWAY_URL}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.webhook-url=${PAYOS_WEBHOOK_URL:}
payos.payout-client-id=${PAYOS_PAYOUT_CLIENT_ID:}
payos.payout-api-key=${PAYOS_PAYOUT_API_KEY:}
payos.payout-checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:}
payos.payout-enabled=${PAYOS_PAYOUT_ENABLED:false}
payos.payout-dry-run=${PAYOUT_DRY_RUN:true}
