spring.application.name=blog-service

#Swagger
springdoc.api-docs.path=/v3/api-docs/blog-service
springdoc.swagger-ui.enabled=false

spring.config.import=optional:file:.env[.properties]

server.port=${PORT}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
#eureka.instance.hostname=${spring.application.name}
#eureka.instance.prefer-ip-address=false
#eureka.instance.instance-id=${spring.application.name}:${random.value}

# Chỉ dùng zipkin khi deploy lên docker
management.tracing.enabled=true
# Mở tất cả các endpoint của Actuator (health, metrics, zipkin...) qua web
management.endpoints.web.exposure.include=*
#100% request sẽ được thu thập và gửi đi.
management.tracing.sampling.probability=1.0
# endpoint của zipkin server
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}

# Actuator with prometheus
management.metrics.export.prometheus.enabled=true

spring.datasource.url=${BLOG_SERVICE_DB_URL}
spring.datasource.username=${BLOG_SERVICE_DB_USER}
spring.datasource.password=${BLOG_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=${BLOG_IMAGE_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${BLOG_IMAGE_MULTIPART_MAX_REQUEST_SIZE:20MB}

#Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

blog.image.max-files-per-upload=${BLOG_IMAGE_MAX_FILES_PER_UPLOAD:10}
blog.image.max-file-size-bytes=${BLOG_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
blog.image.allowed-content-types=${BLOG_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
blog.image.unused-retention-hours=${BLOG_IMAGE_UNUSED_RETENTION_HOURS:24}
blog.image.orphan-cleanup-batch-size=${BLOG_IMAGE_ORPHAN_CLEANUP_BATCH_SIZE:50}

gateway.url=${GATEWAY_URL}
