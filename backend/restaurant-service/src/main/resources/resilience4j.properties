# Resilience4j Circuit Breaker Configuration

resilience4j.circuitbreaker.instances.catalogService.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.catalogService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.catalogService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.imageService.sliding-window-size=10
resilience4j.circuitbreaker.instances.imageService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.imageService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.imageService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.imageService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.imageService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50

# Retry
resilience4j.retry.instances.catalogService.max-attempts=3
resilience4j.retry.instances.catalogService.wait-duration=500
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=500
resilience4j.retry.instances.imageService.max-attempts=3
resilience4j.retry.instances.imageService.wait-duration=500