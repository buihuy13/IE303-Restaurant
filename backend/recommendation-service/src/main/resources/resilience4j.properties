resilience4j.circuitbreaker.instances.reviewService.sliding-window-size=10
resilience4j.circuitbreaker.instances.reviewService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.reviewService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.reviewService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.reviewService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.reviewService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

resilience4j.retry.instances.reviewService.max-attempts=3
resilience4j.retry.instances.reviewService.wait-duration=500
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=500