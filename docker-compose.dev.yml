services:
    zipkin:
        image: openzipkin/zipkin
        ports:
            - '9411:9411'
    rabbitmq:
        image: 'rabbitmq:3-management'
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        ports:
            - '5672:5672' #Cho các service kết nối đến
            - '15672:15672' #Dành cho UI
        healthcheck:
            test: ['CMD', 'rabbitmqctl', 'status']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    redis:
        image: 'redis:7-alpine'
        container_name: redis
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        ports:
            - '6379:6379'
        command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s # Check mỗi 10s
            timeout: 3s # Không response sau 3s thì timeout
            retries: 5 # Thử lại 5 lần trước khi mark là unhealthy
            start_period: 10s # Cho 10s bắt đầu trước khi healthcheck
    
    keycloak:
        image: quay.io/keycloak/keycloak:24.0.0
        #override entrypoint để chạy script init.sh
        entrypoint: ["/bin/bash"]
        command: ["/tmp/init.sh"]
        env_file:
            - ./.env
        environment:
            - KC_DB=postgres
            - KC_HEALTH_ENABLED=true
            - KC_METRICS_ENABLED=true
            # Tắt Cache để sửa theme thấy ngay lập tức (Chỉ dùng cho DEV)
            - KC_SPI_THEME_CACHE_THEMES=false
            - KC_SPI_THEME_CACHE_TEMPLATES=false
            - KC_SPI_THEME_STATIC_MAX_AGE=-1
            - KC_HTTP_PORT=9091
            # Dev: Keycloak is exposed on host :9090 (no Caddy on :8443). Overrides KC_HOSTNAME in .env.
            - KC_HOSTNAME=localhost:9090
            - KC_HOSTNAME_PATH=/auth
            - KC_PROXY=edge
            - KC_HTTP_RELATIVE_PATH=/auth
        ports:  
            - '9090:9091'
        volumes:
            - ./keycloak-config/realm.json:/tmp/realm.json:ro
            - ./keycloak-config/init.sh:/tmp/init.sh:ro
            - ./keycloak-config/themes:/opt/keycloak/themes
        extra_hosts:
            - "host.docker.internal:host-gateway"
    prometheus:
        image: prom/prometheus:latest
        container_name: 'prometheus'
        restart: 'unless-stopped'
        ports:
            - '9000:9090'
        volumes:
            - ./monitoring:/etc/prometheus
            - prometheus-data:/prometheus
        command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml
        healthcheck:
            test: [ "CMD", "nc", "-z", "localhost", "9090" ]
    grafana:
        image: grafana/grafana:latest
        env_file:
            - ./.env
        container_name: grafana
        restart: 'unless-stopped'
        ports:
            - '3030:3000'
        volumes:
            - grafana-data:/var/lib/grafana #Lưu dashboard lại khi restart container
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - prometheus
        healthcheck:
            test: [ "CMD", "nc", "-z", "localhost", "3000" ]
            
    # postgres:
    #     ports:
    #         - "5432:5432"

    ngrok:
        image: ngrok/ngrok:latest
        restart: unless-stopped
        environment:
            - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
        command:
            - "http"
            - "host.docker.internal:8087"
        ports:
            - "4040:4040"
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    rabbitmq-data:
    grafana-data:
    prometheus-data: