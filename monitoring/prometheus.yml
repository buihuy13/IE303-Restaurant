global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-cloud-eureka'
    metrics_path: '/actuator/prometheus'
    eureka_sd_configs:
      - server: 'http://service-discovery:8761/eureka'
        refresh_interval: 30s # Bao lâu hỏi Eureka 1 lần

    # Xử lý metadata từ Eureka để biến thành Label trong Grafana
    relabel_configs:
      # Chỉ lấy các service đang up
      - source_labels: [__meta_eureka_app_instance_status]
        regex: UP
        action: keep
      # Lấy tên service
      - source_labels: [__meta_eureka_app_name]
        target_label: application
      # Lấy id của instance
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance